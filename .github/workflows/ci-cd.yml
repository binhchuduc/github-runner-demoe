name: CI/CD demo
on:
    push:
        branches: [ main, dev]
    pull_request:
        branches: [ main, dev]
jobs:
    test:
        name: Run Tests
        runs-on: [self-hosted, windows]
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Locate Python
              shell: cmd
              run: |
                where python >nul 2>&1 && echo Python already on PATH && exit /b 0
                if exist "%LOCALAPPDATA%\Programs\Python\Python310\python.exe" echo %LOCALAPPDATA%\Programs\Python\Python310>>"%GITHUB_PATH%" && echo %LOCALAPPDATA%\Programs\Python\Python310\Scripts>>"%GITHUB_PATH%" && exit /b 0
                if exist "%LOCALAPPDATA%\Programs\Python\Python314\python.exe" echo %LOCALAPPDATA%\Programs\Python\Python314>>"%GITHUB_PATH%" && echo %LOCALAPPDATA%\Programs\Python\Python314\Scripts>>"%GITHUB_PATH%" && exit /b 0
                if exist "C:\Users\binh.chu\AppData\Local\Programs\Python\Python310\python.exe" echo C:\Users\binh.chu\AppData\Local\Programs\Python\Python310>>"%GITHUB_PATH%" && echo C:\Users\binh.chu\AppData\Local\Programs\Python\Python310\Scripts>>"%GITHUB_PATH%" && exit /b 0
                if exist "C:\Program Files\Python310\python.exe" echo C:\Program Files\Python310>>"%GITHUB_PATH%" && echo C:\Program Files\Python310\Scripts>>"%GITHUB_PATH%" && exit /b 0
                echo Python was not found on this runner. Install Python or restart the runner service after installing it.
                exit /b 1
            - name: Verify Python version
              shell: cmd
              run: |
                where python
                python --version
            - name: Install dependencies
              shell: cmd
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt
            - name: Run tests
              shell: cmd
              run: |
                python -m pytest test_app.py -v
    build:
        name: Build Docker Image
        runs-on: [self-hosted, windows]
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Build Docker Image
              shell: cmd
              run: docker build -t ci-cd-demo:latest .
    deploy:
        name: Deploy to localhost
        runs-on: [self-hosted, windows]
        needs: build
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Stop old container
              shell: cmd
              run: |
                 docker rm -f python-app || exit /b 0
            - name: Start new container
              shell: cmd
              run: |
                 docker run -d --name python-app -p 5001:5001 --restart unless-stopped ci-cd-demo:latest
            - name: check deployment
              shell: cmd
              run: |
                timeout /t 10 /nobreak
                curl -f http://localhost:5001/health || exit /b 1
                echo Deployment successful
            - name: show running containers
              shell: cmd
              run: docker ps --filter "name=python-app"